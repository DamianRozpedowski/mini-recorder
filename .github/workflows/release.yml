name: Build and release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MiniRecorder.exe
        shell: cmd
        run: |
          set CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe
          if not exist "%CSC%" set CSC=%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe
          "%CSC%" /nologo /target:winexe /optimize+ /win32icon:app.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:MiniRecorder.exe src\*.cs

      - name: Package MiniRecorder.zip
        shell: pwsh
        run: Compress-Archive -Path MiniRecorder.exe, README.md -DestinationPath MiniRecorder.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniRecorder
          path: MiniRecorder.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" MiniRecorder.zip --title "Mini Recorder ${{ github.ref_name }}" --generate-notes
